<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 860" width="640" height="860" style="background-color: #0b1120;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
  <!-- Background Header -->
  <rect x="0" y="0" width="640" height="60" fill="#020617" />
  <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">CASE STUDY 2: FLOWCHART SPECIFICATION</text>
  <text x="20" y="52" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Smart Warehouse Inventory &amp; Automated Stock Reorder Engine</text>
  
  <!-- Flowchart Diagram -->
  <g transform="translate(40, 50)">
    
      <g>
        <path d="M 250 57 L 250 83" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 137 L 250 173" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 227 L 250 263" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 317 L 250 345" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 380 L 440 380 L 440 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="396" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 250 415 L 250 453" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="396" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 507 L 250 535" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 570 L 440 570 L 440 543" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="586" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 605 L 250 633" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="586" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 597 L 250 713" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 687 L 250 713" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
    
      <g id="node-1">
        
        <rect x="155" y="3" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="34" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">START</text>
        
      </g>
    
      <g id="node-2">
        
        <polygon points="169,83 345,83 331,137 155,137" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="106" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Input Item Master &amp; Daily Demand</text>
        <text x="250" y="122" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">SKU, Lead Time, Unit Cost</text>
      </g>
    
      <g id="node-3">
        
        <rect x="155" y="173" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="196" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Calculate ROP &amp; EOQ Formulae</text>
        <text x="250" y="212" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">ROP = (d * L) + SS</text>
      </g>
    
      <g id="node-4">
        
        <polygon points="169,263 345,263 331,317 155,317" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="286" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Receive Transaction Event</text>
        <text x="250" y="302" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">DISPATCH or RECEIPT</text>
      </g>
    
      <g id="node-5">
        
        <polygon points="250,345 340,380 250,415 160,380" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="376" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Is Dispatch &lt;= Current Stock?</text>
        <text x="250" y="392" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Solvency Check</text>
      </g>
    
      <g id="node-6">
        
        <rect x="345" y="353" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="384" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Raise InsufficientStock Exception</text>
        
      </g>
    
      <g id="node-7">
        
        <rect x="155" y="453" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="484" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Deduct Dispatched Qty from Stock</text>
        
      </g>
    
      <g id="node-8">
        
        <polygon points="250,535 340,570 250,605 160,570" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="566" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Is Stock &lt;= Reorder Point (ROP)?</text>
        <text x="250" y="582" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Depletion Check</text>
      </g>
    
      <g id="node-9">
        
        <polygon points="359,543 535,543 521,597 345,597" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="440" y="574" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Trigger Purchase Order: Order EOQ</text>
        
      </g>
    
      <g id="node-10">
        
        <rect x="155" y="633" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="664" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Log Inventory Stable</text>
        
      </g>
    
      <g id="node-11">
        
        <rect x="155" y="713" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="744" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">END</text>
        
      </g>
    
  </g>
</svg>