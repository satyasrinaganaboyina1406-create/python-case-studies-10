        <text x="260" y="606" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 617 L 250 653" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 707 L 250 733" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
    
      <g id="node-1">
        
        <rect x="155" y="3" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="34" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">START</text>
        
      </g>
    
