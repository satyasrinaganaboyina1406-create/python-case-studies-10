        <text x="260" y="316" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Passed</text>
      </g>
    
      <g>
        <path d="M 340 400 L 440 400 L 440 373" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="416" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 250 435 L 250 473" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="416" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 527 L 250 555" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 590 L 440 590 L 440 563" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="606" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
