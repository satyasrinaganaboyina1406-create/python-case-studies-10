<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 880" width="640" height="880" style="background-color: #0b1120;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
  <!-- Background Header -->
  <rect x="0" y="0" width="640" height="60" fill="#020617" />
  <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">CASE STUDY 3: FLOWCHART SPECIFICATION</text>
  <text x="20" y="52" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Automated Banking Transaction Ledger &amp; Anomaly Sentry</text>
  
  <!-- Flowchart Diagram -->
  <g transform="translate(40, 50)">
    
      <g>
        <path d="M 250 57 L 250 83" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 137 L 250 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 235 L 250 265" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="216" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Active</text>
      </g>
    
      <g>
        <path d="M 340 300 L 440 300 L 440 273" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="316" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Suspicious</text>
      </g>
    
      <g>
