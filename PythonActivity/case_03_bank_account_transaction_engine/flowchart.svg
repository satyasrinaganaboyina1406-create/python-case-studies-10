        <text x="250" y="312" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Velocity &amp; Spike</text>
      </g>
    
      <g id="node-5">
        
        <rect x="345" y="273" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="304" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Lock Account &amp; Trigger Alert</text>
        
      </g>
    
      <g id="node-6">
        
        <polygon points="250,365 340,400 250,435 160,400" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="396" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Balance + Overdraft &gt;= Amount?</text>
        <text x="250" y="412" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Solvency Check</text>
      </g>
    
      <g id="node-7">
        
        <rect x="345" y="373" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="404" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Reject: Insufficient Funds</text>
        
      </g>
    
      <g id="node-8">
        
        <rect x="155" y="473" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="504" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Execute Debit / Credit Balance</text>
        
      </g>
    
      <g id="node-9">
        
        <polygon points="250,555 340,590 250,625 160,590" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="586" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Is New Balance &lt; $0.00?</text>
        <text x="250" y="602" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Overdraft Incurred?</text>
      </g>
    
      <g id="node-10">
        
        <rect x="345" y="563" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="594" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Apply $35 Overdraft Service Fee</text>
        
      </g>
    
      <g id="node-11">
        
        <polygon points="169,653 345,653 331,707 155,707" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="684" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Commit to Immutable Audit Log</text>
        
      </g>
    
      <g id="node-12">
        
        <rect x="155" y="733" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="764" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">END</text>
        
      </g>
    
