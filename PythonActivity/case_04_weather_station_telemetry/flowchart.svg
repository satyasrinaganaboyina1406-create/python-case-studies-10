<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 790" width="640" height="790" style="background-color: #0b1120;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
  <!-- Background Header -->
  <rect x="0" y="0" width="640" height="60" fill="#020617" />
  <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">CASE STUDY 4: FLOWCHART SPECIFICATION</text>
  <text x="20" y="52" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Meteorological Station Telemetry &amp; Extreme Weather Analyzer</text>
  
  <!-- Flowchart Diagram -->
  <g transform="translate(40, 50)">
    
      <g>
        <path d="M 250 57 L 250 83" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 137 L 250 165" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 200 L 440 200 L 440 173" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="216" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Invalid</text>
      </g>
    
      <g>
        <path d="M 250 235 L 250 273" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="216" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Valid</text>
      </g>
    
      <g>
        <path d="M 440 227 L 250 273" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 327 L 250 363" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 417 L 250 455" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 490 L 440 490 L 440 463" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="506" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 525 L 250 563" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="506" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 517 L 250 563" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 617 L 250 643" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
    
      <g id="node-1">
        
        <rect x="155" y="3" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="34" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">START</text>
        
      </g>
    
      <g id="node-2">
        
        <polygon points="169,83 345,83 331,137 155,137" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="106" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Ingest Sensor Telemetry Stream</text>
        <text x="250" y="122" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Temp, Humidity, Pressure, Wind</text>
      </g>
    
      <g id="node-3">
        
        <polygon points="250,165 340,200 250,235 160,200" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="196" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Are Sensors in Physical Bounds?</text>
        <text x="250" y="212" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">-60°C &lt;= T &lt;= 65°C, 0 &lt;= H &lt;= 100</text>
      </g>
    
      <g id="node-4">
        
        <rect x="345" y="173" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="204" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Interpolate / Mark Sensor Error</text>
        
      </g>
    
      <g id="node-5">
        
        <rect x="155" y="273" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="304" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Compute 3-Hour Moving Average</text>
        
      </g>
    
      <g id="node-6">
        
        <rect x="155" y="363" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="394" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Compute Heat Index / Wind Chill</text>
        
      </g>
    
      <g id="node-7">
        
        <polygon points="250,455 340,490 250,525 160,490" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="486" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Does Reading Breach Warning Limit?</text>
        <text x="250" y="502" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Wind &gt; 62 km/h OR HI &gt; 41°C</text>
      </g>
    
      <g id="node-8">
        
        <polygon points="359,463 535,463 521,517 345,517" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="440" y="494" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Broadcast Civil Meteorological Alert</text>
        
      </g>
    
      <g id="node-9">
        
        <polygon points="169,563 345,563 331,617 155,617" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="594" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Emit Hourly Telemetry Summary</text>
        
      </g>
    
      <g id="node-10">
        
        <rect x="155" y="643" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="674" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">END</text>
        
      </g>
    
  </g>
</svg>