<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 850" width="640" height="850" style="background-color: #0b1120;">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8" />
    </marker>
  </defs>
  <!-- Background Header -->
  <rect x="0" y="0" width="640" height="60" fill="#020617" />
  <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">CASE STUDY 5: FLOWCHART SPECIFICATION</text>
  <text x="20" y="52" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Healthcare Patient Vitals &amp; Emergency Triage System</text>
  
  <!-- Flowchart Diagram -->
  <g transform="translate(40, 50)">
    
      <g>
        <path d="M 250 57 L 250 83" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 137 L 250 173" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 227 L 250 255" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 290 L 440 290 L 440 263" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="306" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 325 L 250 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="306" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 317 L 250 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 407 L 250 435" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 340 470 L 440 470 L 440 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="355" y="486" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">Yes</text>
      </g>
    
      <g>
        <path d="M 250 505 L 250 533" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        <text x="260" y="486" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 497 L 250 623" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 587 L 250 623" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 677 L 250 703" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
    
      <g id="node-1">
        
        <rect x="155" y="3" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="34" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">START</text>
        
      </g>
    
      <g id="node-2">
        
        <polygon points="169,83 345,83 331,137 155,137" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="106" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Input Patient Vital Parameters</text>
        <text x="250" y="122" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">RR, SpO2, BP, HR, Temp, Alertness</text>
      </g>
    
      <g id="node-3">
        
        <rect x="155" y="173" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="196" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Compute NEWS2 Individual Scores</text>
        <text x="250" y="212" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Evaluate 6 Vital Matrices</text>
      </g>
    
      <g id="node-4">
        
        <polygon points="250,255 340,290 250,325 160,290" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="286" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Is Supplemental O2 Used?</text>
        <text x="250" y="302" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Oxygen Therapy Check</text>
      </g>
    
      <g id="node-5">
        
        <rect x="345" y="263" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="294" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Add +2 Points to Score</text>
        
      </g>
    
      <g id="node-6">
        
        <rect x="155" y="353" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="384" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Calculate Cumulative Score</text>
        
      </g>
    
      <g id="node-7">
        
        <polygon points="250,435 340,470 250,505 160,470" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
        <text x="250" y="466" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Score &gt;= 7 OR Any Item == 3?</text>
        <text x="250" y="482" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Emergency Threshold</text>
      </g>
    
      <g id="node-8">
        
        <rect x="345" y="443" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="440" y="474" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Assign Tier 1: HIGH RISK (Immediate)</text>
        
      </g>
    
      <g id="node-9">
        
        <rect x="155" y="533" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="564" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Assign Tier 2 / Tier 3: Medium / Low</text>
        
      </g>
    
      <g id="node-10">
        
        <polygon points="169,623 345,623 331,677 155,677" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="654" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Enqueue to Priority Triage Board</text>
        
      </g>
    
      <g id="node-11">
        
        <rect x="155" y="703" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="734" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">END</text>
        
      </g>
    
  </g>
</svg>