        <text x="440" y="204" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Gross = (40 * Rate) + (OT_Hours * Rate * 1.5)</text>
        
      </g>
    
      <g id="node-5">
        
        <rect x="155" y="263" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="294" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Gross = Hours * Rate</text>
        
      </g>
    
      <g id="node-6">
        
        <rect x="155" y="353" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="384" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Deduct Pre-Tax Health &amp; 401k Contribution</text>
        
      </g>
    
      <g id="node-7">
        
        <rect x="155" y="443" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="466" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Compute Marginal Progressive Tax Brackets</text>
        <text x="250" y="482" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Iterate 10%, 12%, 22%, 24%</text>
      </g>
    
