        <text x="250" y="106" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Input Hours Worked &amp; Hourly Wage</text>
        <text x="250" y="122" fill="#94a3b8" font-size="10" font-family="monospace" text-anchor="middle">Rate, 401k %, Health</text>
      </g>
    
      <g id="node-3">
        
        <polygon points="250,165 340,200 250,235 160,200" fill="#1e1b4b" stroke="#818cf8" stroke-width="2" />
      
