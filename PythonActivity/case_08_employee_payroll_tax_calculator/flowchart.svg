  <text x="20" y="36" fill="#38bdf8" font-size="15" font-weight="bold" font-family="system-ui, sans-serif">CASE STUDY 8: FLOWCHART SPECIFICATION</text>
  <text x="20" y="52" fill="#64748b" font-size="11" font-family="system-ui, sans-serif">Corporate Payroll &amp; Progressive Income Tax Bracket Engine</text>
  
  <!-- Flowchart Diagram -->
  <g transform="translate(40, 50)">
    
      <g>
