        <text x="260" y="216" fill="#fbbf24" font-size="10" font-family="monospace" font-weight="bold">No</text>
      </g>
    
      <g>
        <path d="M 440 227 L 250 353" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
