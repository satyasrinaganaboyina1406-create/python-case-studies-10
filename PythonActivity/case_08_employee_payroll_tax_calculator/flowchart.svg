      </g>
    
      <g>
        <path d="M 250 407 L 250 443" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 497 L 250 533" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 587 L 250 613" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 667 L 250 693" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
      </g>
    
      <g>
        <path d="M 250 747 L 250 773" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowhead)" />
        
