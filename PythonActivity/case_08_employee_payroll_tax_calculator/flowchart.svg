        <text x="250" y="564" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Compute FICA Taxes (Social Security + Medicare)</text>
        
      </g>
    
      <g id="node-9">
        
        <rect x="155" y="613" width="190" height="54" rx="6" fill="#1e293b" stroke="#94a3b8" stroke-width="1.8" />
      
        <text x="250" y="644" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Reconcile Net Pay = Gross - Total Deductions</text>
        
      </g>
    
      <g id="node-10">
        
        <polygon points="169,693 345,693 331,747 155,747" fill="#14532d" stroke="#4ade80" stroke-width="2" />
      
        <text x="250" y="724" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">Render Official Pay Stub Statement</text>
        
      </g>
    
      <g id="node-11">
        
        <rect x="155" y="773" width="190" height="54" rx="26" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
      
        <text x="250" y="804" fill="#f8fafc" font-size="12" font-weight="600" font-family="system-ui, sans-serif" text-anchor="middle">END</text>
        
      </g>
    
